name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  IMG: crpi-d78jk9v69c8g3p1f.cn-hangzhou.personal.cr.aliyuncs.com/k3s-sre/inspection-operator
jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify manifests are up to date
        run: |
          make manifests
          git diff --exit-code config/

      - name: Verify generate is up to date
        run: |
          make generate
          git diff --exit-code

      - name: Run tests
        run: make test
        continue-on-error: true

      - name: Build manager binary
        run: make build

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-d78jk9v69c8g3p1f.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
