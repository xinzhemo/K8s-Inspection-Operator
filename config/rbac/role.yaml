---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - inspection.example.com
  resources:
  - inspectionpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inspection.example.com
  resources:
  - inspectionpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - inspection.example.com
  resources:
  - inspectionpolicies/status
  verbs:
  - get
  - patch
  - update
